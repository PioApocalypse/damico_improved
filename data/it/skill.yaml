# SKILL MECCANICA
universita_skill:
  order:
    - Materie di base
    - Materiali e meccanica
    - Meccanica "calda"
    - Impianti industriali
    - Altro
  lines:
    Materie di base: "analisi 1 e 2, GAL; fisica generale, meccanica del corpo rigido; disegno tecnico con normative ISO su messa in tavola e quotatura, tolleranze e rugosità, uso del software AutoCAD."
    Materiali e meccanica: "tecnologie generali dei materiali, trattamenti termici, diagrammi e prove di resistenza sui metalli; lavorazioni per deformazione plastica a caldo e a freddo, lavorazioni per asportazione di truciolo, saldature, fonderia; meccanica dei corpi continui, teoria tecnica della trave,x principio di De Saint-Venant e criteri di resistenza; resistenza e verifica di strutture sottili tridimensionali, serbatoi a parete sottile, meccanica della frattura, fatica nei materiali, organi di macchine, meccanica applicata."
    Meccanica "calda": "termodinamica applicata, trasmissione del calore; meccanica dei fluidi, accenni di aerodinamica e idraulica; sistemi energetici, classificazione delle macchine, turbine e compressori; aria umida, involucro edilizio, impianti di condizionamento dell'aria, sistemi di produzione idronici, C.T.A., generatori di calore, macchine a compressione di vapore, refrigeratori ad assorbimento."
    Impianti industriali: "indici di prestazione di un impianto, studio e progettazione del layout di impianto, colli di bottiglia, simulazioni e metodo Montecarlo, contabilità industriale, gestione delle scorte in magazzino, distinta base, approvvigionamenti, tempi e metodi, manutenzione."
    Altro: "bilancio di esercizio, fondamenti di elettrotecnica (DC, AC monofase/bifase/trifase, motori elettrici, elettronica di base), sistemi di misura per l'industria 4.0, uso del software LabVIEW, fondamenti di Matlab, teoria del ciclo di vita del prodotto e modellazione CAE con Solidworks 2020."

