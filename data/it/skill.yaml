### NOTA
### order + lines:
### - order è renderizzato in grassetto, i valori sono richiamati in ordine con la linea rispettiva
### - lines è la descrizione di ciascuna skill, renderizzata *senza markdown*
### solo lines:
### niente titolo in grassetto, l'ordine di render è quello dei valori

# SKILL INFORMATICA
sul_campo:
  order:
    - Sistemi operativi
    - Amministrazione di sistemi
    - Web development
    - Programmazione
    - Sicurezza
  lines:
    Sistemi operativi: "utente avanzato di S.O. Linux-based, MS Windows (XP - 11), MacOS e Android; capacità di installazione, configurazione (anche tramite strumenti di automazione quali Ansible e Puppet/OpenVox), gestione e riparazione dei sistemi; destrezza con interfacce a riga di comando (CLI)."
    Amministrazione di sistemi: "esperienze nella gestione e nell'utilizzo di cartelle di rete (sia Windows Server, sia ad esempio WebDAV), webserver (Apache), reverse proxy (nginx), load balancer (Traefik) e gestori di certificati SSL (certbot), dei quali comprendo anche i meccanismi \"dietro le quinte\"; esperienze di installazione e gestione di servizi self-hosted sia in bare metal sia in container - in particolare esperienza con Rustdesk Server, eLabFTW, ownCloud e Nextcloud, Gitea e altri applicativi."
    Web development: "esperienze di installazione \"da zero\" e full life-cycle management di siti web e altri servizi self-hosted, essendomi occupato in particolare di: registrazione e gestione del dominio, acquisto dello spazio web o setup del webserver (con IP pubblico o dietro un proxy), programmazione web front-end (HTML5, CSS3, Typescript) e back-end di piccoli database (SQLite), oppure creazione di contenuti tramite CMS/SSG/framework opportuno (ho esperienza con Hugo, Wordpress, Joomla!, Indico, Flask, Django), dismissione e migrazione."
    Programmazione: "esperienze con Python3 per data analysis/management/parsing, sviluppo web, automazione; competenza in scripting Bash, Zsh, altre shell Unix e Perl; programmazione LabVIEW e Matlab/Simulink in ambito ingegneristico-scientifico; competenza in linguaggi SQL-compliant; destrezza con Git; principiante di GNU Octave, C, Java, disponibile a imparare altri linguaggi."
    Sicurezza: "conoscenza delle misure minime e linee guida in materia di sicurezza informatica AgID, e delle misure di sicurezza di base per i soggetti importanti NIS 2; esperienze minori di pen-testing e di recupero dati da drive compromessi; cyber paranoia/vigilance."


