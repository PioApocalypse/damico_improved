# TRASVERSALI
altre_skill:
  order:
    - Strumenti per redazione di documentazione tecnica
    - Fondamenti di primo soccorso
    - Elettrotecnica applicata
    - Meccanica automobilistica
    - Graphic design e photo editing
    - Video editing
  lines:
    Strumenti per redazione di documentazione tecnica: "esperienza con la suite MS Office e varie alternative open-source (LibreOffice, OnlyOffice...); esperienza con strumenti specifici quali Asciidoctor e Obsidian, framework per siti documentali quali Antora e Hugo, e servizi self-hosted quali Docmost e SiYuan."
    Fondamenti di primo soccorso: "conoscenza del BLSD (Basic Life Support e Defibrillation) laico e sanitario, sia adulto che pediatrico, come da Linee Guida ERC 2025."
    Elettrotecnica applicata: "capacità di effettuare piccole riparazioni elettriche su prese, interruttori, piccoli elettrodomestici e piccoli motori AC; competenza nell'uso di strumenti di misura elettrici (multimetro, cercafase...); conoscenze di elettronica generale."
    Meccanica automobilistica: "familiarità con il motore a combustione interna per la trazione automobilistica, conoscenza della differenza tra motore Otto a benzina, motore Diesel a gasolio, motori \"ibridi\" a gas e ibridi elettrici; conoscenza dei motori più famosi e di storia dell'automobile in Italia; familiarità con lo standard di diagnostica OBD-II."
    Graphic design e photo editing: "dimestichezza con Adobe Photoshop, GIMP e Krita per il fotoritocco e l'editing di file in vari formati; dimestichezza con Inkscape per manipolazione di vettoriali."
    Video editing: "dimestichezza con Kdenlive per montaggio video; competenza con OBS per registrazioni e live streaming - anche con schede di acquisizione e altre periferiche - conoscenza di base di Vegas (ex Sony Vegas)."

