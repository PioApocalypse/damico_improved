# SKILL MECCANICA
meccanica:
  order:
    - Progettazione meccanica e prototipazione rapida
    - Misurazione e controllo della qualità
    - Materiali metallici
    - Impianti industriali
    - Da esami a scelta
    - Software
  lines:
    Progettazione meccanica e prototipazione rapida: "fondamenti di macchine utensili tradizionali e a controllo numerico (CNC), conoscenza di base del linguaggio G-code, uso del software CIMCO Edit; nozioni sulla prototipazione rapida e sulla stampa 3D (FDM, SLA)."
    Misurazione e controllo della qualità: "dimestichezza con i principali strumenti di misura da officina (calibro, micrometro, spessometro...), conoscenza delle principali tolleranze geometrice, dimensionali, di rugosità; conoscenza delle proprietà meccaniche dei materiali metallici, delle lavorazioni e dei trattamenti termici e di rifinitura più comuni."
    Materiali metallici: "tecnologie generali dei materiali, trattamenti termici, diagrammi e prove di resistenza sui metalli; lavorazioni per deformazione plastica a caldo e a freddo, lavorazioni per asportazione di truciolo, saldature, fonderia"
    Impianti industriali: "indici di prestazione di un impianto, studio e progettazione del layout di impianto, colli di bottiglia, simulazioni e metodo Montecarlo, contabilità industriale, gestione delle scorte in magazzino, distinta base, approvvigionamenti, tempi e metodi, manutenzione."
    Da esami a scelta: "conoscenza dei vari elementi di un impianto di climatizzazione industriale aeraulico o idronico, capacità di dimensionamento di un impianto e scelta di componentistica da catalogo; conoscenza dei principali sistemi di produzione dell'energia elettrica, dei meccanismi che regolano il mercato dell'energia in Italia, della struttura della rete elettrica italiana; sistemi di misura per l'industria, sensori e trasduttori, capacità di sviluppo software per l'analisi delle misurazioni e per la regolazione automatica dei processi produttivi; competenze avanzate in sistemi informatici."
    Software: "LabVIEW, Matlab/Simulink, AutoCAD e alternative, Solidworks, Catia V5, FreeCAD; conoscenze di Ansys; pyOBD per diagnostica automobilistica via OBD-II."

