header: 'Chi sono'
lines:
  - "Laureato in **Ingegneria Meccanica** presso l'Università degli Studi di Salerno, appassionato di termodinamica aaplicata e sistemi energetici, ma anche di statica e costruzione di macchine."
  - "Lavoro come **sistemista informatico**, sperando di potermi specializzare un giorno in questo settore. Ho esperienze di programmazione in Python per data management e nell'installazione e gestione di applicativi server sia bare-metal sia containerizzate (Docker, VM)."
  # - "Cerco esperienze di lavoro nei settori energetico, metalmeccanico e informatico, e sono motivato ad ampliare il mio set di conoscenze tecniche, tecnologiche, amministrative e sociali in questi ambiti."
  - Attualmente - e fino a dicembre 2025 - lavoro come sistemista per l'**Istituto CNR-SPIN**, presso la sede di Napoli in località Monte S. Angelo.
  - "Mi definisco un **generalista**, e punto sempre a sapere un po' di tutto piuttosto che tutto di poco."
