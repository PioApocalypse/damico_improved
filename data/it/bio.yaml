header: "In poche parole"
lines:
  - "Laureato in **Ingegneria Meccanica** presso l'Università degli Studi di Salerno, durante gli studi ho scoperto una forte propensione verso l'IT. Partendo da una passione per l'energetica, l'elettrica e l'ingegneria meccanica ho iniziato quindi a specializzarmi verso il settore informatico, maturando conoscenze di **reti e sistemi operativi**, **data management** e **programmazione**."
  # - "Lavoro come **sistemista informatico**, sperando di potermi specializzare un giorno in questo settore. Ho esperienze di programmazione in Python per data management e nell'installazione e gestione di applicativi server sia bare-metal sia containerizzate (Docker, VM)."
  # - "Cerco esperienze di lavoro nei settori energetico, metalmeccanico e informatico, e sono motivato ad ampliare il mio set di conoscenze tecniche, tecnologiche, amministrative e sociali in questi ambiti."
  - "Attualmente lavoro come sistemista per l'**Istituto CNR-SPIN**, presso la sede di Napoli in località Monte S. Angelo. Qui mi occupo principalmente di gestione e manutenzione di macchine di calcolo e virtualizzatori, assistenza tecnica e sviluppo software."
  - "Mi definisco un **generalista**, e punto sempre a sapere un po' di tutto piuttosto che tutto di poco."
