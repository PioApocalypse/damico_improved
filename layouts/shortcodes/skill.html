<!-- Assegno a $data il contenuto della directory /data/{Lang} -->
{{ $data := index site.Data site.Language.Lang }}
<!-- Introdotto in 291d2d2a 
     molto più pulito del puttanaio sovrastante
     (rollback: commit 81dd0d28) -->
{{ $category := (.Get "skill") }}
{{ $path := index $data.skill $category }}
<ul>
{{ range $line := $path.order }}
    {{ $description := index $path.lines $line }}
    <li><strong>{{ . }}:</strong> {{ $description }}</li>
{{ end }}
</ul>
